{% extends 'trainer/trainer_base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<h2 class="text-center mb-4">Add Diet Plan</h2>

<form method="POST">
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-primary">
        Save diet plan
    </button>
</form>

{% endblock %}
