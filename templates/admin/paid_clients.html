{% extends 'admin/admin_base.html' %}

{% block content %}

<div class="container-fluid">
    <h3 class="text-dark text-center mb-4">Paid Customers</h3>

    <div class="row">
        <div class="col-12">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>MemberShip</th>
                        <th>Fee</th>
                        <th>Phone Number</th>
                    </tr>
                </thead>

                <tbody>
                    {% for i in data %}
                    <tr>
                        <td>{{ i.booking.client }}</td>
                        <td>{{ i.booking.client.membership }}</td>
                        <td>₹{{ i.booking.schedule.fee }}</td>
                        <td>{{ i.booking.client.phone }}</td>
                    </tr>

                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

{% endblock %}
