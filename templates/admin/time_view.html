{% extends "admin/admin_base.html" %}
{% block content %}



<table class="table table-bordered">
    <thead>
        <tr>


            <th>Start Time</th>
            <th>End Time</th>
            <th>Fee</th>
            <th>Edit Time</th>


        </tr>
    </thead>


<tbody>
    {% for i in data %}
    <tr>


        <td>{{ i.start_time }}</td>
        <td>{{ i.end_time }}</td>
        <td>{{ i.fee }}</td>
         <td>  <a href="{% url 'schedule_update' i.id %}" class="btn btn-primary">Edit Time </a></td>


    </tr>

    {% endfor %}
</tbody>


</table>

{% endblock %}
