{% extends "admin/admin_base.html" %}

{% block content %}

<!--<h2>Deleted Clients</h2>-->

<!--<a href="{% url 'admin_client_view' %}" class="btn btn-primary mb-3">-->
<!--    Back to Clients-->
<!--</a>-->

<table class="table">
    <thead>
        <tr>
            <th>Sl</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for i in data %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.name }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.phone }}</td>
            <td>
                <a href="{% url 'client_restore' i.id %}"
                   class="btn btn-success"
                   onclick="return confirm('Are you sure you want to restore this client?');">
                    Restore
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No deleted clients found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
